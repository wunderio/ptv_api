services:
  ptv_api.client:
    class: Drupal\ptv_api\Service\PtvClient
    arguments:
      - '@http_client'
      - '@logger.channel.ptv_api'
      - '@cache.ptv_bin'
      - '@key.repository'
      - '@datetime.time'
      - '@config.factory'

  logger.channel.ptv_api:
    parent: logger.channel_base
    arguments: ['ptv_api']

  cache.ptv_bin:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: cache_factory:get
    arguments: [ptv_bin]
